name: Publish Linux AMD64 Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  publish-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux AMD64 binary
        run: |
          mkdir -p dist
          BUILD_VERSION="1.0.3-${GITHUB_REF_NAME}.${GITHUB_SHA::7}"
          go build -trimpath -ldflags="-s -w -X github.com/szilab/RunPilot/internal/version.Version=${BUILD_VERSION}" -o dist/runpilot-linux-amd64 ./cmd/runpilot
          mkdir -p dist/bundle/plugins/remote-xpra dist/bundle/plugins/remote-rdp dist/bundle/plugins/remote-vnc
          cp dist/runpilot-linux-amd64 dist/bundle/runpilot
          go build -trimpath -ldflags="-s -w -X github.com/szilab/RunPilot/internal/version.Version=${BUILD_VERSION}" -o dist/bundle/plugins/remote-xpra/runpilot-plugin-remote-xpra ./cmd/runpilot-plugin-remote-xpra
          go build -trimpath -ldflags="-s -w -X github.com/szilab/RunPilot/internal/version.Version=${BUILD_VERSION}" -o dist/bundle/plugins/remote-rdp/runpilot-plugin-remote-rdp ./cmd/runpilot-plugin-remote-rdp
          go build -trimpath -ldflags="-s -w -X github.com/szilab/RunPilot/internal/version.Version=${BUILD_VERSION}" -o dist/bundle/plugins/remote-vnc/runpilot-plugin-remote-vnc ./cmd/runpilot-plugin-remote-vnc
          for plugin in remote-xpra remote-rdp remote-vnc; do cp "plugins/$plugin/plugin.yaml" "dist/bundle/plugins/$plugin/"; done
          tar -C dist/bundle -czf dist/runpilot-linux-amd64.tar.gz runpilot plugins
          sha256sum dist/runpilot-linux-amd64 > dist/runpilot-linux-amd64.sha256
          printf '%s\n' "$BUILD_VERSION" > dist/runpilot-linux-amd64.version
          cp install.sh dist/install.sh

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "tag=main-latest" >> "$GITHUB_OUTPUT"
            echo "title=RunPilot main latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop-latest" >> "$GITHUB_OUTPUT"
            echo "title=RunPilot develop latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move rolling release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$TAG" --title "$TITLE" --prerelease
            else
              gh release edit "$TAG" --title "$TITLE" --prerelease=false
            fi
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" --title "$TITLE" --notes "Rolling Linux AMD64 build from the develop branch." --prerelease --verify-tag
          else
            gh release create "$TAG" --title "$TITLE" --notes "Rolling Linux AMD64 build from the main branch." --verify-tag
          fi

          gh release upload "$TAG" \
            dist/runpilot-linux-amd64 \
            dist/runpilot-linux-amd64.sha256 \
            dist/runpilot-linux-amd64.version \
            dist/runpilot-linux-amd64.tar.gz \
            dist/install.sh \
            --clobber

      - name: Create immutable v1.0.3 release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: v1.0.3
        shell: bash
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "$VERSION_TAG already exists; leaving the immutable release unchanged."
            exit 0
          fi

          gh release create "$VERSION_TAG" \
            dist/runpilot-linux-amd64 \
            dist/runpilot-linux-amd64.sha256 \
            dist/runpilot-linux-amd64.version \
            dist/runpilot-linux-amd64.tar.gz \
            dist/install.sh \
            --target "$GITHUB_SHA" \
            --title "RunPilot v1.0.3" \
            --generate-notes
