name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.38.0"
      - name: Build System ABI test fixture
        run: go generate ./plugins/system/backend
      - name: Build Tasks plugin backend
        run: go generate ./plugins/tasks/backend
      - name: Check plugin frontend JavaScript
        run: |
          node --input-type=module --check < plugins/tasks/web/plugin.js
          node --test plugins/test-fixtures/tasks-web/plugin.test.mjs
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux artifact
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/runpilot-linux-amd64 ./cmd/runpilot

      - name: Build ASUSTOR App Central package
        shell: bash
        run: |
          set -euo pipefail
          CORE_VERSION="$(go run ./cmd/runpilot version | sed 's/^RunPilot //')"
          APK_VERSION="1.0.5.r${GITHUB_RUN_NUMBER}"
          ./tools/asustor/build.sh "$APK_VERSION" "$CORE_VERSION"
          (cd dist && sha256sum --check "runpilot_${APK_VERSION}_x86-64.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: runpilot-linux-amd64
          path: dist/runpilot-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: runpilot-asustor-${{ github.sha }}
          path: |
            dist/runpilot_1.0.5.r${{ github.run_number }}_x86-64.apk
            dist/runpilot_1.0.5.r${{ github.run_number }}_x86-64.apk.sha256

