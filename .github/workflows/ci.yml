name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.38.0"
      - name: Build System ABI test fixture
        run: go generate ./internal/plugins/system_fixture/backend
      - name: Build Tasks plugin backend
        run: go generate ./plugins/tasks/backend
      - name: Check plugin frontend JavaScript
        run: |
          node --input-type=module --check < plugins/tasks/web/plugin.js
          node --test internal/plugins/testdata/tasks-web/plugin.test.mjs
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux artifact
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/runpilot-linux-amd64 ./cmd/runpilot

      - uses: actions/upload-artifact@v4
        with:
          name: runpilot-linux-amd64
          path: dist/runpilot-linux-amd64

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t runpilot:ci .
      - name: Smoke test container image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name runpilot-ci -p 127.0.0.1:9070:9070 \
            -v /var/run/docker.sock:/var/run/docker.sock runpilot:ci
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:9070/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9070/healthz
          # RunPilot must run as the unprivileged runpilot user (UID 1000) under tini.
          docker exec runpilot-ci sh -c 'test "$(awk "/^Uid:/{print \$2}" /proc/$(pgrep -x runpilot)/status)" = 1000 && test "$(cat /proc/1/comm)" = tini'
          docker exec runpilot-ci sh -c 'bash --version >/dev/null && python3 --version && ssh -V && docker compose version'
      - name: Container logs
        if: always()
        run: docker logs runpilot-ci || true

