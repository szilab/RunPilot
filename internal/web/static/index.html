<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunPilot</title>
  <link rel="icon" type="image/png" href="runpilot-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <img class="brand-mark" src="runpilot-logo.png" alt="RunPilot logo">
          <div class="brand-text"><strong>RunPilot</strong><span>Server automation</span></div>
        </div>
      </div>
      <nav>
        <button class="nav active" type="button" data-page="overview" title="Overview"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span class="nav-label">Overview</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav sidebar-settings-nav" type="button" data-page="settings" title="Settings"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1A7 7 0 0 0 14.5 6L14.2 3h-4.4L9.5 6a7 7 0 0 0-2 .9l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 .9l.3 3h4.4l.3-3a7 7 0 0 0 2-.9l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg><span class="nav-label">Settings</span></button>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-11-3 3 3 3"/></svg><span>Collapse sidebar</span>
        </button>
        <div class="side-foot" role="status" aria-live="polite">
          <span id="connectionDot" class="dot"></span>
          <span id="connectionText" class="side-foot-label">Not authenticated</span>
          <span id="systemVersion" class="system-version" aria-label="RunPilot version"></span>
        </div>
        <div id="connectionWarning" class="connection-warning hidden" role="alert" aria-label="HTTP connection: WebSocket payload encryption is disabled." title="HTTP connection: WebSocket payload encryption is disabled.">HTTP connection: WebSocket payload encryption is disabled.</div>
      </div>
    </aside>

    <main>
      <header>
        <h1 id="pageTitle">Overview</h1>
        <div class="header-actions">
          <button id="themeToggle" class="button secondary theme-toggle" type="button" aria-pressed="false" title="Switch to dark theme">☾ <span>Dark theme</span></button>
          <div id="pluginHeaderActions" class="plugin-header-actions hidden"></div>
        </div>
      </header>

      <section id="overviewPage" class="page active">
        <div id="hostDashboard" class="host-dashboard"></div>
      </section>

      <section id="legacyStoragePage" class="page">
        <div id="storageBrowser">
          <div id="storageStateNotice" class="notice hidden"></div>
          <div class="section-head storage-toolbar"><div><label for="storageProvider" class="storage-provider-label">Location</label><select id="storageProvider" aria-label="Storage location"></select></div><div class="row-actions"><label class="check compact-check"><input id="storageShowHidden" type="checkbox"> Hidden files</label><label class="button secondary small">Upload<input id="storageUpload" type="file" multiple hidden></label><button id="storageNewFile" class="button secondary small">New file</button><button id="storageCreate" class="button secondary small">New folder</button></div></div>
          <div id="storageBreadcrumbs" class="meta"></div><div id="storageEntries" class="row-list"></div>
        </div>
        <div id="storageEmpty" class="empty hidden"><h2>Storage unavailable</h2><p>RunPilot could not initialize the local filesystem location.</p></div>
      </section>

      <section id="legacySoftwarePage" class="page">
        <div class="software-controller"><label for="softwareProviderSelect">Provider</label><select id="softwareProviderSelect" aria-label="Software provider"></select></div>
        <div id="softwareProviderCard" class="row-list software-card"></div>
        <div id="softwareTabs" class="software-tabs hidden">
          <button class="button secondary small active" data-software-tab="installed">Installed</button>
          <button class="button secondary small" data-software-tab="search">Search</button>
          <button class="button secondary small" data-software-tab="updates">Updates</button>
          <button class="button secondary small" data-software-tab="buckets">Buckets</button>
          <button id="softwareUpgradeAll" class="button primary small">Upgrade all</button>
        </div>
        <div id="softwareSearchBar" class="software-search hidden"><input id="softwareSearchInput" placeholder="Search the managed Scoop main bucket"><button id="softwareSearchButton" class="button primary small">Search</button></div>
        <div id="softwareBucketBar" class="software-bucket-bar hidden"><input id="softwareBucketName" placeholder="Bucket name"><input id="softwareBucketSource" placeholder="Optional HTTPS bucket URL"><button id="softwareAddBucket" class="button primary small">Add bucket</button></div>
        <div id="softwarePackages" class="row-list"></div>
      </section>

      <section id="settingsPage" class="page">
        <section class="overview-section"><div class="section-head"><h2>Plugins</h2><div class="header-actions"><button id="restartApplicationButton" class="button danger" type="button">Restart RunPilot</button><button class="button secondary" type="button" onclick="refreshPluginCatalog()">Check for updates</button></div></div><div id="pluginSettings" class="plugin-settings-grid rp-masonry"></div></section>
      </section>
    </main>
  </div>

  <dialog id="loginDialog" class="dialog small">
    <form method="dialog" id="loginForm">
      <div class="dialog-head">
        <div><h2>Connect to RunPilot</h2><p>Enter the API token stored in <code>runpilot.yaml</code>.</p></div>
      </div>
      <label>Access token<input id="tokenInput" type="password" autocomplete="current-password" required></label>
      <div id="loginError" class="form-error hidden"></div>
      <div class="dialog-actions">
        <button class="button primary" value="default">Connect</button>
      </div>
    </form>
  </dialog>


  <dialog id="textEditorDialog" class="dialog log-dialog"><div class="dialog-head"><div><h2 id="textEditorTitle">Fájl szerkesztése</h2><p id="textEditorPath"></p></div><button class="icon-btn" id="closeTextEditor" type="button">×</button></div><div class="editor-shell"><pre id="textHighlight" aria-hidden="true"><code></code></pre><textarea id="textEditorContent" class="text-editor" spellcheck="false"></textarea></div><div class="dialog-actions"><button class="button secondary" id="cancelTextEditor" type="button">Mégse</button><button class="button primary" id="saveTextEditor" type="button">Mentés</button></div></dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="secure-websocket.js"></script>
  <script src="auth-storage.js"></script>
  <script src="browser-launch.js"></script>
</body>
</html>
