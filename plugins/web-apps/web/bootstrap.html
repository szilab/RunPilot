    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --surface: #101827; --card: #182338; --text: #edf3ff; --muted: #9cacc5; --border: #2d3c54; --accent: #a0b9ff; } }

    h1 { font-size: 24px; line-height: 1.3; letter-spacing: -.03em; margin: 8px 0 12px; }
